<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Diot-Siaci — document intelligence POC</title>
  <desc id="desc">A portfolio card describing a PDF analysis pipeline from document preparation to retrieval, LLM calls, structured answers, and annotations.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBFAFF"/><stop offset="1" stop-color="#F0EDFF"/></linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#79C9FF"/><stop offset="0.5" stop-color="#AA9DFF"/><stop offset="1" stop-color="#FF9BCB"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#786CAC" flood-opacity="0.14"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="370" rx="34" fill="url(#bg)"/>
  <circle cx="1129" cy="47" r="82" fill="#AA9DFF" opacity="0.17" filter="url(#glow)"/>
  <circle cx="680" cy="334" r="88" fill="#79C9FF" opacity="0.15" filter="url(#glow)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#171720">
    <text x="54" y="57" font-family="Courier New, monospace" font-size="11" letter-spacing="1.8" fill="#78718B">DIOT-SIACI · APPLIED AI · 2024—2025</text>
    <text x="54" y="119" font-size="38" font-weight="680" letter-spacing="-1.5">Turn long documents</text>
    <text x="54" y="160" font-family="Georgia, Times New Roman, serif" font-size="39" font-style="italic">into traceable answers.</text>
    <text x="55" y="207" font-size="17" fill="#686476">A complete technical POC: prepare the PDF, retrieve</text>
    <text x="55" y="232" font-size="17" fill="#686476">the right context, query LLMs, and return to the source.</text>
    <text x="55" y="280" font-family="Courier New, monospace" font-size="10" font-weight="700" letter-spacing="1.2" fill="#57516B">PARSING · RETRIEVAL · LLM · API · TESTS · DOCUMENTATION</text>
    <g transform="translate(54 307)" font-family="Courier New, monospace" font-size="10" fill="#5B5669">
      <rect width="72" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.78"/><text x="17" y="18">PYTHON</text>
      <rect x="82" width="76" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.78"/><text x="98" y="18">FASTAPI</text>
      <rect x="168" width="72" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.78"/><text x="185" y="18">OPENAI</text>
      <rect x="250" width="64" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.78"/><text x="267" y="18">BM25</text>
    </g>
  </g>

  <g transform="translate(695 34)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <rect width="451" height="302" rx="31" fill="#FFFFFF" fill-opacity="0.64" stroke="#FFFFFF" stroke-width="2"/>
    <path d="M31 1H419C436 1 450 15 450 32" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
    <circle cx="27" cy="26" r="4" fill="#FF9BBC"/><circle cx="41" cy="26" r="4" fill="#FFD070"/><circle cx="55" cy="26" r="4" fill="#8BE0C1"/>
    <text x="226" y="30" text-anchor="middle" font-family="Courier New, monospace" font-size="10" letter-spacing="1.2" fill="#78718B">DOCUMENT PIPELINE</text>

    <path d="M79 163H365" stroke="url(#pipe)" stroke-width="5" stroke-linecap="round" opacity="0.45"/>
    <g transform="translate(24 72)">
      <g>
        <rect width="92" height="176" rx="20" fill="#FFFFFF" fill-opacity="0.92"/>
        <path d="M62 0L92 30H67C64 30 62 28 62 25Z" fill="#DDD6FF"/>
        <text x="16" y="28" font-family="Courier New, monospace" font-size="9" letter-spacing="1" fill="#716B80">PDF</text>
        <rect x="16" y="51" width="56" height="5" rx="2.5" fill="#B8B1C5"/><rect x="16" y="65" width="45" height="4" rx="2" fill="#DBD6E3"/><rect x="16" y="76" width="60" height="4" rx="2" fill="#DBD6E3"/>
        <rect x="16" y="99" width="60" height="30" rx="7" fill="#EFF7FF"/><rect x="23" y="107" width="46" height="4" rx="2" fill="#8FCFFF"/><rect x="23" y="116" width="34" height="4" rx="2" fill="#C4DDF3"/>
        <text x="16" y="155" font-size="10" font-weight="700" fill="#171720">Structured</text><text x="16" y="168" font-size="9" fill="#777181">Markdown</text>
      </g>

      <g transform="translate(112 31)">
        <circle cx="44" cy="57" r="44" fill="#ECF6FF" stroke="#FFFFFF" stroke-width="2"/>
        <text x="44" y="44" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#6F7281">RETRIEVE</text>
        <text x="44" y="63" text-anchor="middle" font-size="11" font-weight="700" fill="#171720">BM25</text>
        <text x="44" y="78" text-anchor="middle" font-size="9" fill="#777181">embeddings</text>
      </g>

      <g transform="translate(220 31)">
        <circle cx="44" cy="57" r="44" fill="#EEE9FF" stroke="#FFFFFF" stroke-width="2"/>
        <text x="44" y="44" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#6F6981">ORCHESTRATE</text>
        <text x="44" y="64" text-anchor="middle" font-size="12" font-weight="700" fill="#171720">LLM</text>
        <text x="44" y="79" text-anchor="middle" font-size="9" fill="#777181">parallel calls</text>
      </g>

      <g transform="translate(326)">
        <rect width="77" height="176" rx="20" fill="#171720"/>
        <text x="38" y="26" text-anchor="middle" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#C9C3D5">OUTPUT</text>
        <circle cx="38" cy="61" r="17" fill="#8BE0C1"/><path d="M30 61L36 67L47 53" fill="none" stroke="#171720" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <rect x="15" y="92" width="47" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.8"/><rect x="15" y="104" width="38" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.35"/><rect x="15" y="116" width="44" height="4" rx="2" fill="#FFFFFF" fill-opacity="0.35"/>
        <text x="38" y="145" text-anchor="middle" font-size="9" fill="#FFFFFF">JSON · Excel</text><text x="38" y="159" text-anchor="middle" font-size="9" fill="#FFFFFF">annotated PDF</text>
      </g>
    </g>
    <text x="24" y="283" font-family="Courier New, monospace" font-size="9" letter-spacing="1.1" fill="#7A7588">SOURCE PRESERVED · CONTROLLED OUTPUTS · INTEGRABLE API</text>
  </g>
</svg>
