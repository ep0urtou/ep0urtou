<svg xmlns="http://www.w3.org/2000/svg" width="720" height="780" viewBox="0 0 720 780" role="img" aria-labelledby="title desc">
  <title id="title">How Baptiste Avert builds — Understand. Build. Ship.</title>
  <desc id="desc">A mobile three-step product engineering process: understand the business need, build the complete product coherently, then test and ship work the team can use.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F8FAFE"/><stop offset="1" stop-color="#EEF4FC"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#79C9FF"/><stop offset="0.5" stop-color="#AA9DFF"/><stop offset="1" stop-color="#84DDBF"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFC2DA"/><stop offset="1" stop-color="#EC8FCB"/></linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C9BFFF"/><stop offset="1" stop-color="#958AF2"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C6F4E6"/><stop offset="1" stop-color="#74D6B5"/></linearGradient>
    <filter id="glass" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#737B9B" flood-opacity="0.13"/></filter>
    <clipPath id="frame"><rect width="720" height="780" rx="40"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="720" height="780" rx="40" fill="url(#page)"/>
    <circle cx="654" cy="90" r="105" fill="url(#pink)" opacity="0.2"/>
    <circle cx="645" cy="735" r="130" fill="url(#lilac)" opacity="0.16"/>

    <g fill="#171720">
      <text x="38" y="54" font-family="Courier New, monospace" font-size="11" letter-spacing="2" fill="#7E8191">HOW I BUILD · 01—03</text>
      <text x="38" y="111" font-family="Arial, Helvetica, sans-serif" font-size="45" font-weight="650" letter-spacing="-2.5">Clear choices.</text>
      <text x="38" y="160" font-family="Georgia, Times New Roman, serif" font-size="47" font-style="italic" letter-spacing="-1.8">Solid execution.</text>
      <text x="40" y="202" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626572">Understand before coding, explain the trade-offs,</text>
      <text x="40" y="228" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626572">then leave a result the team can actually use.</text>
    </g>

    <g filter="url(#glass)"><rect x="28" y="266" width="664" height="466" rx="34" fill="#FFFFFF" fill-opacity="0.62" stroke="#FFFFFF" stroke-width="2"/></g>
    <rect x="79" y="339" width="4" height="288" rx="2" fill="url(#rail)" opacity="0.5"/>

    <g font-family="Arial, Helvetica, sans-serif" fill="#171720">
      <circle cx="81" cy="341" r="29" fill="url(#pink)"/><text x="81" y="347" text-anchor="middle" font-size="15" font-weight="750">01</text>
      <text x="130" y="320" font-family="Courier New, monospace" font-size="11" letter-spacing="1.5" fill="#777A89">UNDERSTAND</text>
      <text x="130" y="354" font-size="23" font-weight="650" letter-spacing="-0.6">Start with what matters.</text>
      <text x="130" y="383" font-size="15" fill="#696C78">Need, constraints, and people before code.</text>

      <circle cx="81" cy="487" r="29" fill="url(#lilac)"/><text x="81" y="493" text-anchor="middle" font-size="15" font-weight="750">02</text>
      <text x="130" y="466" font-family="Courier New, monospace" font-size="11" letter-spacing="1.5" fill="#777A89">BUILD</text>
      <text x="130" y="500" font-size="23" font-weight="650" letter-spacing="-0.6">Keep the product connected.</text>
      <text x="130" y="529" font-size="15" fill="#696C78">Interface, backend, data, and AI move together.</text>

      <circle cx="81" cy="633" r="29" fill="url(#mint)"/><text x="81" y="639" text-anchor="middle" font-size="15" font-weight="750">03</text>
      <text x="130" y="612" font-family="Courier New, monospace" font-size="11" letter-spacing="1.5" fill="#777A89">SHIP</text>
      <text x="130" y="646" font-size="23" font-weight="650" letter-spacing="-0.6">Finish cleanly.</text>
      <text x="130" y="675" font-size="15" fill="#696C78">Test, deploy, refine, and make it easy to own.</text>
    </g>
  </g>
</svg>
