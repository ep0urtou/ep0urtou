<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
  <title id="title">Postureo — public experience and operations platform</title>
  <desc id="desc">A portfolio card presenting the public website and private operations panel built for Postureo.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F9FCFB"/><stop offset="1" stop-color="#EAF8F5"/></linearGradient>
    <linearGradient id="mintBlue" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#8BE0C1"/><stop offset="1" stop-color="#79C9FF"/></linearGradient>
    <filter id="shadow" x="-20%" y="-30%" width="140%" height="170%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#548E84" flood-opacity="0.14"/></filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>
  <rect width="1200" height="370" rx="34" fill="url(#bg)"/>
  <circle cx="1128" cy="52" r="82" fill="#79C9FF" opacity="0.16" filter="url(#glow)"/>
  <circle cx="683" cy="326" r="92" fill="#8BE0C1" opacity="0.16" filter="url(#glow)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#171720">
    <text x="54" y="57" font-family="Courier New, monospace" font-size="11" letter-spacing="1.8" fill="#6F827D">POSTUREO · CLIENT PLATFORM · 2026</text>
    <text x="54" y="119" font-size="38" font-weight="680" letter-spacing="-1.5">Connect the public experience</text>
    <text x="54" y="160" font-family="Georgia, Times New Roman, serif" font-size="39" font-style="italic">to daily operations.</text>
    <text x="55" y="207" font-size="17" fill="#62716E">A guided exoskeleton website and the private panel</text>
    <text x="55" y="232" font-size="17" fill="#62716E">that turns incoming signals into concrete actions.</text>
    <text x="55" y="280" font-family="Courier New, monospace" font-size="10" font-weight="700" letter-spacing="1.2" fill="#4E6660">PRODUCT DESIGN &amp; FULL-STACK · CLIENT PROJECT</text>
    <g transform="translate(54 307)" font-family="Courier New, monospace" font-size="10" fill="#50635F">
      <rect width="58" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.8"/><text x="17" y="18">CRM</text>
      <rect x="68" width="88" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.8"/><text x="84" y="18">ANALYTICS</text>
      <rect x="166" width="92" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.8"/><text x="181" y="18">CONTENT</text>
      <rect x="268" width="70" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.8"/><text x="286" y="18">STOCK</text>
    </g>
  </g>

  <g transform="translate(695 39)" filter="url(#shadow)" font-family="Arial, Helvetica, sans-serif">
    <g transform="translate(0 22) rotate(-3 159 130)">
      <rect width="318" height="260" rx="28" fill="#FFFFFF" fill-opacity="0.7" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M28 1H288C304 1 317 14 317 30" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
      <circle cx="24" cy="23" r="4" fill="#FF9BBC"/><circle cx="38" cy="23" r="4" fill="#FFD070"/><circle cx="52" cy="23" r="4" fill="#8BE0C1"/>
      <text x="290" y="27" text-anchor="end" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#74827F">PUBLIC SITE</text>
      <rect x="20" y="48" width="278" height="96" rx="19" fill="url(#mintBlue)" opacity="0.88"/>
      <circle cx="245" cy="96" r="41" fill="#FFFFFF" fill-opacity="0.26"/>
      <path d="M215 105C225 74 244 67 261 86C276 104 268 124 248 130" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.75"/>
      <text x="36" y="80" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#1C4B46">FROM THE GESTURE</text>
      <text x="36" y="110" font-size="19" font-weight="700" fill="#17312E">Find the right</text>
      <text x="36" y="132" font-size="19" font-weight="700" fill="#17312E">support.</text>
      <rect x="20" y="160" width="126" height="78" rx="17" fill="#FFFFFF" fill-opacity="0.82"/>
      <rect x="158" y="160" width="140" height="78" rx="17" fill="#FFFFFF" fill-opacity="0.82"/>
      <text x="35" y="184" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#788681">GUIDED</text>
      <text x="35" y="214" font-size="14" font-weight="700" fill="#171720">Qualification</text>
      <text x="173" y="184" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#788681">PRODUCT</text>
      <text x="173" y="214" font-size="14" font-weight="700" fill="#171720">Recommendation</text>
    </g>

    <g transform="translate(226 2) rotate(3 137 145)">
      <rect width="274" height="290" rx="28" fill="#171720" stroke="#FFFFFF" stroke-width="2"/>
      <path d="M27 1H245C261 1 273 14 273 30" fill="none" stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
      <circle cx="23" cy="23" r="4" fill="#FF9BBC"/><circle cx="37" cy="23" r="4" fill="#FFD070"/><circle cx="51" cy="23" r="4" fill="#8BE0C1"/>
      <text x="246" y="27" text-anchor="end" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#ADB5B4">OPS PANEL</text>
      <text x="24" y="75" font-family="Courier New, monospace" font-size="8" letter-spacing="1" fill="#8BE0C1">TODAY · PRIORITIES</text>
      <g transform="translate(22 91)">
        <rect width="230" height="45" rx="14" fill="#FFFFFF" fill-opacity="0.08"/><circle cx="20" cy="22" r="6" fill="#FF9BBC"/><text x="36" y="20" font-size="11" font-weight="700" fill="#FFFFFF">New request</text><text x="36" y="33" font-size="9" fill="#AEB2BC">Review qualification</text>
        <rect y="55" width="230" height="45" rx="14" fill="#FFFFFF" fill-opacity="0.08"/><circle cx="20" cy="77" r="6" fill="#79C9FF"/><text x="36" y="75" font-size="11" font-weight="700" fill="#FFFFFF">Conversation</text><text x="36" y="88" font-size="9" fill="#AEB2BC">Reply to client</text>
        <rect y="110" width="230" height="45" rx="14" fill="#FFFFFF" fill-opacity="0.08"/><circle cx="20" cy="132" r="6" fill="#8BE0C1"/><text x="36" y="130" font-size="11" font-weight="700" fill="#FFFFFF">Inventory</text><text x="36" y="143" font-size="9" fill="#AEB2BC">Stock signal</text>
      </g>
      <rect x="22" y="258" width="230" height="15" rx="7.5" fill="url(#mintBlue)" opacity="0.72"/>
    </g>
  </g>
</svg>
