<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc">
  <title id="title">Baptiste Avert — I turn complexity into clarity</title>
  <desc id="desc">Editorial portrait of Baptiste Avert with oversized typography, restrained glass, and soft liquid spheres inspired by his portfolio.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAFBFE"/>
      <stop offset="1" stop-color="#F3F6FD"/>
    </linearGradient>
    <linearGradient id="mainOrb" x1="0.12" y1="0.05" x2="0.9" y2="0.92">
      <stop offset="0" stop-color="#FFB8D3"/>
      <stop offset="0.46" stop-color="#F18BC7"/>
      <stop offset="0.78" stop-color="#A79AF8"/>
      <stop offset="1" stop-color="#7EA7FF"/>
    </linearGradient>
    <linearGradient id="blueOrb" x1="0.18" y1="0.08" x2="0.85" y2="0.92">
      <stop offset="0" stop-color="#C8F3FF"/>
      <stop offset="0.58" stop-color="#79C9FF"/>
      <stop offset="1" stop-color="#7D94F3"/>
    </linearGradient>
    <radialGradient id="shine" cx="34%" cy="23%" r="72%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.98"/>
      <stop offset="0.13" stop-color="#FFFFFF" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="orbShadow" x="-35%" y="-35%" width="170%" height="185%">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#8079B8" flood-opacity="0.2"/>
    </filter>
    <filter id="glassShadow" x="-15%" y="-40%" width="130%" height="190%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#7D8095" flood-opacity="0.12"/>
    </filter>
    <filter id="softBlur" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="3.8"/>
    </filter>
  </defs>

  <rect width="1200" height="520" fill="url(#page)"/>

  <g filter="url(#glassShadow)">
    <rect x="54" y="28" width="1092" height="66" rx="33" fill="#FFFFFF" fill-opacity="0.58" stroke="#FFFFFF" stroke-width="1.5"/>
    <path d="M84 29H1112C1129 29 1143 43 1143 60" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round" opacity="0.92"/>
  </g>

  <g font-family="Arial, Helvetica, sans-serif" fill="#171720">
    <circle cx="86" cy="61" r="18" fill="#F8FAFF" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="86" y="66" text-anchor="middle" font-size="12" font-weight="700">BA</text>
    <text x="118" y="54" font-family="Courier New, monospace" font-size="9" letter-spacing="1.2" fill="#555766">SOFTWARE ENGINEER</text>
    <text x="118" y="69" font-family="Courier New, monospace" font-size="9" letter-spacing="1.2" fill="#555766">ORIENTED PRODUCT</text>
    <text x="530" y="65" font-family="Courier New, monospace" font-size="10" letter-spacing="1.4" fill="#686A78">PRODUCT · FULL-STACK · APPLIED AI</text>
    <circle cx="1065" cy="61" r="5" fill="#63C795"/>
    <text x="1080" y="65" font-family="Courier New, monospace" font-size="9" letter-spacing="1.2" fill="#555766">AVAILABLE</text>
  </g>

  <g filter="url(#orbShadow)">
    <circle cx="966" cy="278" r="174" fill="url(#mainOrb)"/>
    <circle cx="966" cy="278" r="174" fill="url(#shine)"/>
    <circle cx="1092" cy="430" r="100" fill="url(#blueOrb)"/>
    <circle cx="1092" cy="430" r="100" fill="url(#shine)"/>
    <circle cx="804" cy="154" r="40" fill="#FFB4D2"/>
    <circle cx="804" cy="154" r="40" fill="url(#shine)"/>
    <circle cx="1114" cy="129" r="28" fill="url(#blueOrb)"/>
    <circle cx="1114" cy="129" r="28" fill="url(#shine)"/>
  </g>
  <circle cx="785" cy="422" r="22" fill="url(#blueOrb)" opacity="0.88" filter="url(#softBlur)"/>

  <g font-family="Arial, Helvetica, sans-serif" fill="#171720">
    <text x="68" y="147" font-family="Courier New, monospace" font-size="11" letter-spacing="2.1" fill="#898A98">BAPTISTE AVERT · PARIS</text>
    <text x="68" y="231" font-size="78" font-weight="520" letter-spacing="-4.7">I turn</text>
    <text x="68" y="305" font-family="Georgia, Times New Roman, serif" font-size="80" font-style="italic" letter-spacing="-3.8">complexity</text>
    <text x="68" y="380" font-size="78" font-weight="520" letter-spacing="-4.7">into clarity.</text>
    <text x="70" y="430" font-size="17" fill="#666773">I build digital products where the interface, the system,</text>
    <text x="70" y="456" font-size="17" fill="#666773">and artificial intelligence tell the same story.</text>
  </g>

  <g transform="translate(69 477)" font-family="Courier New, monospace" font-size="9" letter-spacing="1.15" fill="#858794">
    <circle cx="6" cy="-3" r="5" fill="#63C795" opacity="0.25"/>
    <circle cx="6" cy="-3" r="2.5" fill="#55BB87"/>
    <text x="18" y="0">OPEN TO TEAM · FREELANCE</text>
  </g>
  <text x="1128" y="477" text-anchor="end" font-family="Courier New, monospace" font-size="9" letter-spacing="1.2" fill="#858794">FR · EN C1</text>
</svg>
