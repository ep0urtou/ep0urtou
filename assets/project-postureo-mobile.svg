<svg xmlns="http://www.w3.org/2000/svg" width="720" height="560" viewBox="0 0 720 560" role="img" aria-labelledby="title desc">
  <title id="title">Postureo — public experience and operations platform</title><desc id="desc">Mobile product card showing the connection between a public website and a private operations panel.</desc>
  <defs>
