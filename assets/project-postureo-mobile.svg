      <text x="38" y="82" font-family="Courier New, monospace" font-size="9" letter-spacing="1" fill="#1C4B46">FROM THE GESTURE</text><text x="38" y="119" font-size="24" font-weight="700" fill="#17312E">Find the right</text><text x="38" y="145" font-size="24" font-weight="700" fill="#17312E">support.</text>
      <rect x="20" y="178" width="165" height="64" rx="18" fill="#FFFFFF"/><rect x="197" y="178" width="173" height="64" rx="18" fill="#FFFFFF"/>
