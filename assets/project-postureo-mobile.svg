        <rect y="58" width="246" height="46" rx="14" fill="#FFFFFF" fill-opacity="0.09"/><circle cx="20" cy="81" r="6" fill="#79C9FF"/><text x="38" y="79" font-size="12" font-weight="700" fill="#FFFFFF">Conversation</text><text x="38" y="93" font-size="9" fill="#AEB2BC">Reply to client</text>
