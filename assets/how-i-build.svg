<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
  <title id="title">How Baptiste Avert builds — Understand. Build. Ship.</title>
  <desc id="desc">A three-step product engineering process: understand the business need, build the complete product coherently, then test and ship work the team can use.</desc>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F8FAFE"/>
      <stop offset="0.55" stop-color="#F3F7FD"/>
      <stop offset="1" stop-color="#EEF4FC"/>
    </linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#79C9FF"/>
      <stop offset="0.5" stop-color="#AA9DFF"/>
      <stop offset="1" stop-color="#84DDBF"/>
    </linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFC2DA"/><stop offset="1" stop-color="#EC8FCB"/></linearGradient>
    <linearGradient id="lilac" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C9BFFF"/><stop offset="1" stop-color="#958AF2"/></linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#C6F4E6"/><stop offset="1" stop-color="#74D6B5"/></linearGradient>
    <filter id="glass" x="-15%" y="-20%" width="130%" height="150%"><feDropShadow dx="0" dy="14" stdDeviation="22" flood-color="#737B9B" flood-opacity="0.13"/></filter>
    <clipPath id="frame"><rect width="1200" height="380" rx="40"/></clipPath>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="380" rx="40" fill="url(#page)"/>
    <circle cx="421" cy="-24" r="115" fill="url(#pink)" opacity="0.22"/>
    <circle cx="1132" cy="362" r="142" fill="url(#lilac)" opacity="0.18"/>

    <g fill="#171720">
      <text x="64" y="59" font-family="Courier New, monospace" font-size="11" letter-spacing="2" fill="#7E8191">HOW I BUILD · 01—03</text>
      <text x="64" y="126" font-family="Arial, Helvetica, sans-serif" font-size="49" font-weight="650" letter-spacing="-2.7">Clear choices.</text>
      <text x="64" y="178" font-family="Georgia, Times New Roman, serif" font-size="51" font-style="italic" letter-spacing="-2">Solid execution.</text>
      <text x="66" y="224" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626572">Understand before coding, explain the trade-offs,</text>
      <text x="66" y="250" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#626572">then leave a result the team can actually use.</text>
    </g>

    <g font-family="Courier New, monospace" font-size="10" letter-spacing="1" fill="#686B79">
      <rect x="64" y="292" width="93" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.74" stroke="#FFFFFF"/>
      <text x="110.5" y="311" text-anchor="middle">PRODUCT</text>
      <rect x="166" y="292" width="112" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.74" stroke="#FFFFFF"/>
      <text x="222" y="311" text-anchor="middle">FULL-STACK</text>
      <rect x="287" y="292" width="104" height="30" rx="15" fill="#FFFFFF" fill-opacity="0.74" stroke="#FFFFFF"/>
      <text x="339" y="311" text-anchor="middle">DELIVERY</text>
    </g>

    <g filter="url(#glass)">
      <rect x="504" y="34" width="650" height="312" rx="34" fill="#FFFFFF" fill-opacity="0.6" stroke="#FFFFFF" stroke-width="2"/>
    </g>
    <rect x="557" y="88" width="4" height="190" rx="2" fill="url(#rail)" opacity="0.5"/>

    <g font-family="Arial, Helvetica, sans-serif" fill="#171720">
      <circle cx="559" cy="90" r="27" fill="url(#pink)"/>
      <text x="559" y="96" text-anchor="middle" font-size="15" font-weight="750">01</text>
      <text x="607" y="77" font-family="Courier New, monospace" font-size="10" letter-spacing="1.5" fill="#777A89">UNDERSTAND</text>
      <text x="607" y="105" font-size="22" font-weight="650" letter-spacing="-0.6">Start with what matters.</text>
      <text x="607" y="130" font-size="14" fill="#696C78">Business need, constraints, and people before code.</text>

      <circle cx="559" cy="187" r="27" fill="url(#lilac)"/>
      <text x="559" y="193" text-anchor="middle" font-size="15" font-weight="750">02</text>
      <text x="607" y="174" font-family="Courier New, monospace" font-size="10" letter-spacing="1.5" fill="#777A89">BUILD</text>
      <text x="607" y="202" font-size="22" font-weight="650" letter-spacing="-0.6">Keep the whole product connected.</text>
      <text x="607" y="227" font-size="14" fill="#696C78">Interface, backend, data, and AI move together.</text>

      <circle cx="559" cy="284" r="27" fill="url(#mint)"/>
      <text x="559" y="290" text-anchor="middle" font-size="15" font-weight="750">03</text>
      <text x="607" y="271" font-family="Courier New, monospace" font-size="10" letter-spacing="1.5" fill="#777A89">SHIP</text>
      <text x="607" y="299" font-size="22" font-weight="650" letter-spacing="-0.6">Finish cleanly.</text>
      <text x="607" y="324" font-size="14" fill="#696C78">Test, deploy, refine, and make the result easy to own.</text>
    </g>
  </g>
</svg>
